<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">passcode의 스택 재사용</title><desc id="desc">welcome 입력의 마지막 4바이트가 반환 뒤에도 남아 login의 초기화되지 않은 passcode1과 겹치는 과정</desc><defs><style>@font-face{font-family:DiagramText;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:DiagramText,sans-serif}</style><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#222"/></marker></defs><rect width="1100" height="530" fill="white"/><text x="35" y="42" font-size="20" fill="#222" text-anchor="start">① welcome() 실행 중</text>
<rect x="35" y="70" width="300" height="230" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="35" y="208" width="300" height="92" fill="#ededeb" stroke="#222" stroke-width="1.5"/>
<text x="185" y="126" font-size="19" fill="#222" text-anchor="middle">name[0:96]</text>
<text x="185" y="157" font-size="16" fill="#555" text-anchor="middle">96바이트 패딩</text>
<text x="185" y="242" font-size="18" fill="#222" text-anchor="middle">name[96:100]</text>
<text x="185" y="276" font-size="18" fill="#222" text-anchor="middle">fflush@GOT 주소</text>
<path d="M343,254 H387" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="42" font-size="20" fill="#222" text-anchor="start">② welcome() 반환 후</text>
<rect x="400" y="70" width="300" height="230" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="400" y="208" width="300" height="92" fill="#ededeb" stroke="#222" stroke-width="1.5"/>
<text x="550" y="126" font-size="18" fill="#222" text-anchor="middle">이전 입력이</text>
<text x="550" y="155" font-size="18" fill="#222" text-anchor="middle">메모리에 남아 있음</text>
<text x="550" y="242" font-size="18" fill="#222" text-anchor="middle">같은 4바이트</text>
<text x="550" y="276" font-size="18" fill="#222" text-anchor="middle">fflush@GOT 주소</text>
<path d="M708,254 H752" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="765" y="42" font-size="20" fill="#222" text-anchor="start">③ login() 실행 중</text>
<rect x="765" y="70" width="300" height="230" fill="white" stroke="#222" stroke-width="1.5"/>
<rect x="765" y="208" width="300" height="92" fill="#ededeb" stroke="#222" stroke-width="1.5"/>
<text x="915" y="126" font-size="18" fill="#222" text-anchor="middle">login()이 같은 스택</text>
<text x="915" y="155" font-size="18" fill="#222" text-anchor="middle">영역을 재사용</text>
<text x="915" y="242" font-size="18" fill="#222" text-anchor="middle">passcode1</text>
<text x="915" y="276" font-size="18" fill="#222" text-anchor="middle">fflush@GOT 주소</text>
<path d="M35,320 V332 H1065 V320" stroke="#888" fill="none"/>
<text x="550" y="363" font-size="17" fill="#222" text-anchor="middle">회색 칸은 같은 메모리 주소의 4바이트입니다.</text>
<line x1="35" y1="391" x2="1065" y2="391" stroke="#ccc"/>
<text x="35" y="427" font-size="17" fill="#222" text-anchor="start">초기화하지 않은 passcode1은 이전 입력의 4바이트를 값으로 사용합니다.</text>
<text x="35" y="459" font-size="17" fill="#222" text-anchor="start">scanf(&quot;%d&quot;, passcode1)은 그 값을 주소로 받아, 입력한 정수를 fflush@GOT에 씁니다.</text>
<text x="35" y="506" font-size="13" fill="#666" text-anchor="start">name + 96과 passcode1의 중첩만 표시한 개념도입니다. 나머지 스택 요소는 생략했습니다.</text></svg>